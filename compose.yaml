services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upsolve
      POSTGRES_USER: ${DB_USER:-upsolve}
      POSTGRES_PASSWORD: ${DB_PASS:-upsolve}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-upsolve} -d upsolve"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-upsolve}
      DB_PASS: ${DB_PASS:-upsolve}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      CF_API_BASE_URL: ${CF_API_BASE_URL:-https://codeforces.com/api}
      CF_RATE_LIMIT_MS: ${CF_RATE_LIMIT_MS:-2500}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
